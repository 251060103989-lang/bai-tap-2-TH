<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin cá nhân & Danh sách sở thích</title>
    
    <!-- 1. External CSS: Liên kết tệp style.css -->
    <link rel="stylesheet" href="style.css">

    <!-- 2. Internal CSS: Sử dụng thẻ <style> -->
    <style>
        /* Định dạng tiêu đề bằng thẻ <style> */
        h1, h2 {
            font-family: Arial, sans-serif;
        }
        
        /* Định dạng danh sách sở thích bằng thẻ <style> */
        .hobby-list {
            list-style-type: square; /* Thay đổi kiểu dấu đầu dòng */
            padding-left: 20px;
        }
    </style>
</head>
<body>

    <!-- Khung thông tin (.profile) -->
    <div class="profile">
        <!-- Ảnh đại diện dạng hình tròn với ID #avatar -->
        <img id="avatar" src="https://via.placeholder.com/120" alt="Ảnh đại diện">

        <!-- Tiêu đề h1 & h2 -->
        <div class="header-banner">
            <h1>THÔNG TIN CÁ NHÂN</h1>
            <h2>Lập trình viên Web</h2>
        </div>

        <!-- Inline CSS: Thay đổi màu sắc của họ tên bằng 3 cách khai báo màu khác nhau (màu tên, HEX, RGB/RGBA) -->
        <p>Họ và tên: <strong style="color: blue;">Nguyễn Văn A</strong></p> <!-- Tên màu -->
        <p>Email: <a href="mailto:nguyenvana@example.com">nguyenvana@example.com</a></p>
        <p>Giới thiệu: <span style="color: #2c3e50;">Tôi là sinh viên yêu thích lập trình web.</span></p> <!-- HEX -->
        <p>Trạng thái: <span style="color: rgba(46, 204, 113, 1);">Đang học tập</span></p> <!-- RGBA -->

        <!-- Danh sách sở thích -->
        <h2>Danh sách sở thích</h2>
        <ul class="hobby-list">
            <li>Đọc sách công nghệ</li>
            <li>Lập trình web</li>
            <li>Nghe nhạc thư giãn</li>
            <li>Chơi bóng đá</li>
        </ul>
    </div>

</body>
</html>
