<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2: Bảng điểm sinh viên</title>
    <!-- Gọi file style.css dùng chung ở ngoài -->
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <a href="../index.html" class="back-link">← Quay về Trang chủ</a>

    <div class="table-container">
        <span class="table-badge">BẢNG ĐIỂM</span>
        <h2>Bảng Điểm Sinh Viên</h2>
        <table class="student-table">
            <thead>
                <tr>
                    <th class="col-stt">STT</th>
                    <th>Mã Sinh Viên</th>
                    <th>Họ và Tên</th>
                    <th>Môn Học</th>
                    <th class="col-score">Điểm</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="col-stt">1</td>
                    <td>SV001</td>
                    <td>Nguyễn Văn A</td>
                    <td>Lập trình Web</td>
                    <td class="col-score">8.5</td>
                </tr>
                <tr>
                    <td class="col-stt">2</td>
                    <td>SV002</td>
                    <td>Trần Thị B</td>
                    <td>Cơ sở dữ liệu</td>
                    <td class="col-score">9.0</td>
                </tr>
                <tr>
                    <td class="col-stt">3</td>
                    <td>SV003</td>
                    <td>Lê Văn C</td>
                    <td>Mạng máy tính</td>
                    <td class="col-score">7.5</td>
                </tr>
            </tbody>
            <tfoot>
                <tr class="avg-row">
                    <td colspan="4">Điểm trung bình tích lũy</td>
                    <td class="col-score">8.33</td>
                </tr>
            </tfoot>
        </table>
    </div>
</body>
</html>
